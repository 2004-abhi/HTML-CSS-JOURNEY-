<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table{
              border-collapse: collapse;
            border-color: black;
        }
        tbody{
            background-color:rgb(167, 209, 104);
            text-align: center;
        }
    thead{
        background-color: rgb(204, 204, 100);
    }
    tfoot{
        background-color: rgb(205, 135, 205);
    }
    </style>
</head>
<body>
    <table border="1" cellpadding="10px">
        <thead>
        <tr>
            <th>PRODUCT</th>
            <th>QUANTITY</th>
            <th>PRICE</th>
        </tr>
</thead>
<tbody>
        <tr>
            <td>laptop</td>
            <td>2</td>
            <td>120000</td>
        </tr>

        <tr>
            <td>keybord</td>
            <td>3</td>
            <td>1500</td>
        </tr>

        <tr>
            <td>mouse</td>
            <td>1</td>
            <td>500</td>
        </tr>
</tbody>
<tfoot>
        <tr>
            <th>GRAND TOTAL</th>
            <th>6</th>
            <th>122000</th>
        </tr>
        </tfoot>
    </table>
</body>
</html>
